<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>권역별 해양기상 데이터 다중 API 병합 테스트 (전국)</title>
  <link rel="stylesheet" href="css\style.css">
</head>
<body>
  <h1>전국 권역 기상 데이터 병합 테스트</h1>
  <header>
    <div><span class="header-title">낚시 지도 맵</span></div>
    <span class="location">🚩</span><span class="location" id="gps">경상남도 창원시 진해구</span>
  </header>

  <main class="content-container">
    <object id="SvgObject" data="JidoV0.3.svg" type="image/svg+xml"></object>
    <aside id="BottomSheet" class="sheet" aria-hidden="true">
        <button id="CloseSheetBtn" style="float: right; margin: 10px;">X</button>
        <article id="SheetArticle">
            <div id="SheetContent">
                <h2>권역별 해양기상 데이터</h2>
                <p>이곳에 권역별 해양기상 데이터를 표시합니다.</p>
            </div>
        </article>
    </aside>
    <script>
        window.changeSVGUrl = function(newUrl) {
            const obj = document.getElementById('svgObject');
            if(obj) {
                obj.data = newUrl;
            };
        };
    </script>
  </main>
  <script src="js\apikey.js"></script>
  <script src="js\virtualStationMap.js"></script>
  <script src="js\dataDisplay.js"></script>
</body>
</html>
