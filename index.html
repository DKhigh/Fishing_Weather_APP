<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>권역별 해양기상 데이터 다중 API 병합 테스트 (전국)</title>
  <link rel="stylesheet" href="css\style.css">
</head>
<body>
  <h1>전국 권역 기상 데이터 병합 테스트</h1>
  <header>
    <button aria-label=home">
      <img src="homeButton.svg" alt="appIcon" class="textIcon">
    </button>
    <div class="headerCenter">
      <img src="appLogo.svg" alt="appIcon" class="textIcon">
      <span>바다보기</span>
    </div>
    <button aria-label="info">
      <img src="infoButton.svg" alt="appIcon" class="textIcon">
    </button>
  </header>

  <div class="locationBar">
    <div class="pillBox">
      <span>🚩</span>
      <span>경상남도 창원시 의창구</span>
    </div>
  </div>

  <main class="content-container">
    <object id="svgObject" data="svg/JidoV0.5.svg" type="image/svg+xml"></object>

    <aside id="BottomSheet" class="sheet" aria-hidden="true">
        <button id="CloseSheetBtn" style="float: right; margin: 10px;">X</button>
        <article id="SheetArticle">
            <div id="SheetContent">
                <h2>권역별 해양기상 데이터</h2>
                <p>이곳에 권역별 해양기상 데이터를 표시합니다.</p>
            </div>
        </article>
    </aside>
    <script>
        window.changeSVGUrl = function(newUrl) {
            const obj = document.getElementById('svgObject');
            if(obj) {
                obj.data = newUrl;
            };
        };
    </script>
  </main>
  <!-- IDE내 스크립트 파일 로드 -->
  <script src="js\apikey.js"></script>
  <script src="js\virtualStationMap.js"></script>
  <script src="js\dataDisplay.js"></script>
  <script src="js\mapData.js"></script>
  <script src="js\main.js"></script>
  <!-- 웹에서는 이렇게 해야 인식하더라.. -->
  <script src="js/apikey.js"></script>
  <script src="js/virtualStationMap.js"></script>
  <script src="js/dataDisplay.js"></script>
  <script src="js/mapData.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
